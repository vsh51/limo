name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: write

jobs:

  # ── Runs on every push / PR ────────────────────────────────────────────────
  build-and-test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr python3-pytest

      - name: Build & run unit tests with coverage
        run: make coverage

      - name: Build release & run integration tests
        run: |
          make build BUILD_TYPE=Release
          make integration-test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report

  # ── Triggered by /test comment on PRs ──────────────────────────────────────
  comment-test:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    steps:
      - name: Create check run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({
              owner, repo,
              pull_number: context.payload.issue.number,
            });
            const check = await github.rest.checks.create({
              owner, repo,
              name: 'PR comment /test',
              head_sha: pr.data.head.sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', check.data.id);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr python3-pytest

      - name: Run tests with coverage
        run: make coverage

      - name: Run integration tests
        run: |
          make build
          make integration-test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report

      - name: Finalize check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.check.outputs.check_id }}'),
              status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });

  # ── Triggered by /docs comment on PRs ──────────────────────────────────────
  comment-docs:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/docs')
    runs-on: ubuntu-latest
    steps:
      - name: Create check run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({
              owner, repo,
              pull_number: context.payload.issue.number,
            });
            const check = await github.rest.checks.create({
              owner, repo,
              name: 'PR comment /docs',
              head_sha: pr.data.head.sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
            });
            core.setOutput('check_id', check.data.id);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Build documentation
        run: make build-docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build/docs/html

      - name: Finalize check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ steps.check.outputs.check_id }}'),
              status: 'completed',
              conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
            });

[project]
name = "limo"
version = "0.1.0"
description = "Linear Method Optimizer — exact rational simplex solver with async web UI"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "flask>=3.0",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
monitoring = ["flower>=2.0"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

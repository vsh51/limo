services:

  # ── Message broker + result backend ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  # ── Flask web server (gunicorn, 2 sync workers) ────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL:    redis://redis:6379/0
      LIMO_BINARY:  /app/limo
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/status')"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ── Celery solver worker (autoscaler will scale this) ─────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: >
      celery -A web.tasks worker
        --loglevel=info
        --concurrency=1
        --without-gossip
        --without-mingle
    environment:
      REDIS_URL:   redis://redis:6379/0
      LIMO_BINARY: /app/limo
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Flower: Celery monitoring UI ───────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: >
      celery -A web.tasks flower
        --port=5555
        --broker_api=redis://redis:6379/0
    environment:
      REDIS_URL:   redis://redis:6379/0
      LIMO_BINARY: /app/limo
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # ── Queue-depth autoscaler ─────────────────────────────────────────────────
  autoscaler:
    build:
      context: .
      dockerfile: docker/Dockerfile.autoscaler
    restart: unless-stopped
    environment:
      REDIS_URL:              redis://redis:6379/0
      COMPOSE_FILE:           /app/project/docker-compose.yml
      COMPOSE_PROJECT_NAME:   limo
      MIN_WORKERS:            "1"
      MAX_WORKERS:            "8"
      TASKS_PER_WORKER:       "2"
      IDLE_BEFORE_SCALE_DOWN: "30"
      CHECK_INTERVAL:         "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/project/docker-compose.yml:ro
    depends_on:
      - redis

  # ── Nginx load balancer + static file server ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/static:/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  redis_data:

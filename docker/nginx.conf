# Nginx reverse proxy / load-balancer for LIMO
#
# Responsibilities:
#   • Serve static assets directly (no hop to Flask, long cache headers)
#   • Forward all other requests to the Flask/gunicorn upstream
#   • Enable gzip for text responses
#
# Scaling: Docker's embedded DNS round-robins across multiple "web" replicas,
# so `least_conn` here gives fair distribution even with a single upstream entry.

upstream limo_app {
    least_conn;
    server web:5050;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/css
        application/javascript
        application/json
        text/plain;

    # ── Static files ──────────────────────────────────────────────────────────
    location /static/ {
        alias       /static/;
        expires     1d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── API + SPA ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://limo_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";   # keep-alive to upstream

        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     30s;
    }
}
